name: magento-lab

networks:
  default:
    name: magento-lab

services:

  # ─── PHP-FPM ─────────────────────────────────────────────────────────────
  # Serves HTTP requests only. No CLI tools here.
  php:
    build:
      context: ./docker/php
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5}
        XDEBUG_ENABLED: ${XDEBUG_ENABLED:-false}
    # Tagged with the PHP version so changing PHP_VERSION never silently
    # reuses an image built for another PHP release.
    image: magento-lab/php:${PHP_VERSION:-8.5}
    pull_policy: never
    container_name: magento_phpfpm
    restart: unless-stopped
    command: php-fpm --allow-to-run-as-root
    environment:
      MAGENTO_MODE: ${MAGENTO_MODE:-developer}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-2G}
    volumes:
      - ./src:/var/www/html:delegated
      - ./modules:/var/www/modules:delegated
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
      - ./docker/php/zz-root.conf:/usr/local/etc/php-fpm.d/zz-root.conf:ro
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      # OpenSearch is not a hard dependency for PHP-FPM to start; it only has
      # to be ready for catalog search. robo up --wait still waits for it.
      opensearch:
        condition: service_started

  # ─── Maintenance (CLI) ────────────────────────────────────────────────────
  # All bin/magento, composer, cron commands run here.
  maintenance:
    build:
      context: ./docker/php
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5}
        XDEBUG_ENABLED: ${XDEBUG_ENABLED:-false}
    image: magento-lab/php:${PHP_VERSION:-8.5}
    pull_policy: never
    container_name: magento_maintenance
    restart: unless-stopped
    command: tail -f /dev/null
    environment:
      MAGENTO_MODE: ${MAGENTO_MODE:-developer}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT_CLI:-4G}
      COMPOSER_ALLOW_SUPERUSER: 1
      COMPOSER_HOME: /composer
    volumes:
      - ./src:/var/www/html:delegated
      - ./modules:/var/www/modules:delegated
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
      - ./:/project
      - ./volumes/.composer:/composer
      - ./volumes/.ssh:/root/.ssh:ro
    depends_on:
      - php

  # ─── Nginx ───────────────────────────────────────────────────────────────
  # Listens on 8080 (Varnish backend). Direct access via host port 8080.
  nginx:
    image: nginx:${NGINX_VERSION:-1.30}-alpine
    container_name: magento_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_DIRECT_PORT:-8080}:8080"
    volumes:
      - ./src:/var/www/html:delegated
      - ./modules:/var/www/modules:delegated
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - php
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/nginx_status || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

  # ─── Varnish ─────────────────────────────────────────────────────────────
  # HTTP cache layer. Public entry point on port 80.
  # Test with/without cache: port 80 (cached) vs port 8080 (direct).
  varnish:
    image: varnish:${VARNISH_VERSION:-8.0}-alpine
    container_name: magento_varnish
    restart: unless-stopped
    ports:
      - "${VARNISH_PORT:-80}:80"
    volumes:
      - ./docker/varnish/default.vcl:/etc/varnish/default.vcl:ro
    command: >
      varnishd
        -F
        -f /etc/varnish/default.vcl
        -s malloc,${VARNISH_SIZE:-256m}
        -a :80
        -T 127.0.0.1:6082
    depends_on:
      - nginx
    tmpfs:
      - /var/lib/varnish:exec,mode=0777

  # ─── MariaDB ─────────────────────────────────────────────────────────────
  db:
    image: mariadb:${MARIADB_VERSION:-12.3}
    container_name: magento_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-magento}
      MARIADB_DATABASE: ${MYSQL_DATABASE:-magento}
      MARIADB_USER: ${MYSQL_USER:-magento}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:-magento}
      # Runs mariadb-upgrade automatically when MARIADB_VERSION is bumped
      # on an existing data volume.
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/zz-custom.cnf:ro
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # ─── OpenSearch ──────────────────────────────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-3.1.0}
    container_name: magento_search
    restart: unless-stopped
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: "-Xms${OPENSEARCH_HEAP:-512m} -Xmx${OPENSEARCH_HEAP:-512m}"
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s

  # ─── Valkey (Redis-compatible) ───────────────────────────────────────────
  valkey:
    image: valkey/valkey:${VALKEY_VERSION:-9.0}-alpine
    container_name: magento_valkey
    restart: unless-stopped
    command: >
      valkey-server
        --maxmemory ${VALKEY_MAXMEMORY:-512mb}
        --maxmemory-policy allkeys-lru
        --save ""
        --appendonly no
        --loglevel notice
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ─── RabbitMQ ────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:${RABBITMQ_VERSION:-4.3}-management-alpine
    container_name: magento_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-magento}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-magento}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-magento}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # ─── Mailpit ─────────────────────────────────────────────────────────────
  # Catches every outbound email (SMTP on mailpit:1025). Web UI on 8025.
  mailpit:
    image: axllent/mailpit:v1.31
    container_name: magento_mail
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"

volumes:
  db_data:
  opensearch_data:
  rabbitmq_data:

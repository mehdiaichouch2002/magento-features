; Dev-only pool override.
; Run workers as root so files created by the maintenance container (also root)
; are writable by PHP-FPM without any chown dance.
[www]
user  = root
group = root

; The image default (5 workers) is exhausted by a single admin page, which
; fires many parallel AJAX requests. 20 workers fit easily in dev memory.
pm                   = dynamic
pm.max_children      = 20
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests      = 500
